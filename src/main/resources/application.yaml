spring:
  application:
    name: api
  datasource:
    url: jdbc:h2:file:${user.home}/.zentask/zentask-db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
