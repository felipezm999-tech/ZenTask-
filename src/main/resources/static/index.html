<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#F5F7FB">
        <meta name="color-scheme" content="light dark">
        <meta name="description" content="Gerenciador de tarefas pessoal.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <script>
            (() => {
                let tema = null;
                try {
                    tema = localStorage.getItem("zentask-tema");
                } catch (erro) {
                    console.warn("Não foi possível ler o tema salvo.", erro);
                }
                if (tema !== "light" && tema !== "dark") {
                    tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                }
                document.documentElement.dataset.theme = tema;
                const metaTema = document.querySelector('meta[name="theme-color"]');
                if (metaTema) metaTema.content = tema === "dark" ? "#20232B" : "#F5F7FB";
            })();
        </script>
        <title>ZenTask</title>
      <script type="module" crossorigin src="/assets/index-B1xEkP0r.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-DMjl9gYk.css">
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
